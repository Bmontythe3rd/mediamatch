[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mediamatch"
version = "1.0.4"
description = "Rename media folders to Plex/Jellyfin naming conventions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bryan Montgomery", email = "bmontgomery@montymail.tech" }]
keywords = ["plex", "jellyfin", "media", "rename", "movies", "tv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia",
]
dependencies = [
    "PySide6>=6.7",
    "guessit>=3.8",
    "tmdbv3api>=1.9",
    "requests>=2.32",
]

[project.scripts]
mediamatch = "mediamatch.main:main"

[project.gui-scripts]
mediamatch-gui = "mediamatch.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediamatch = ["assets/*"]
