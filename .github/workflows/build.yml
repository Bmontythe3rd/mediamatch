name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "v0.0.0-test"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MediaMatch-windows
          - os: macos-latest
            artifact: MediaMatch-macos
          - os: ubuntu-22.04
            artifact: MediaMatch-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ── Linux: install Qt platform dependencies ──────────────────────
      - name: Install Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglib2.0-0 libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            fuse libfuse2

      # ── macOS: convert PNG → proper ICNS ─────────────────────────────
      - name: Build ICNS (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p assets/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/icon.png --out "assets/icon.iconset/icon_${size}x${size}.png"
            double=$((size*2))
            sips -z $double $double assets/icon.png --out "assets/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns assets/icon.iconset -o assets/icon.icns

      # ── PyInstaller ───────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller mediamatch.spec --clean --noconfirm

      # ── Windows: package with Inno Setup ─────────────────────────────
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir dist\installer
          iscc "packaging\windows\installer.iss"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/installer/MediaMatch-*-Setup.exe

      # ── macOS: build .pkg ─────────────────────────────────────────────
      - name: Build macOS .pkg
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/build_pkg.sh
          mkdir -p packaging/macos/resources
          bash packaging/macos/build_pkg.sh

      - name: Upload macOS .pkg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/MediaMatch-*.pkg

      # ── Linux: build AppImage ─────────────────────────────────────────
      - name: Prepare AppDir (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/MediaMatch/* AppDir/usr/bin/
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/mediamatch.png
          cp assets/icon.png AppDir/mediamatch.png
          cp packaging/linux/mediamatch.desktop AppDir/mediamatch.desktop
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Download appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Create AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          ARCH=x86_64 ./appimagetool AppDir dist/MediaMatch-1.0.0-x86_64.AppImage

      - name: Create Linux tar.gz (no FUSE required)
        if: runner.os == 'Linux'
        run: |
          cp packaging/linux/install.sh dist/MediaMatch/install.sh
          chmod +x dist/MediaMatch/install.sh
          tar -czf dist/MediaMatch-1.0.0-linux-x86_64.tar.gz -C dist MediaMatch

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/MediaMatch-*.AppImage
            dist/MediaMatch-*-linux-x86_64.tar.gz

  # ── Publish GitHub Release ──────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MediaMatch-windows/*.exe
            artifacts/MediaMatch-macos/*.pkg
            artifacts/MediaMatch-linux/*.AppImage
            artifacts/MediaMatch-linux/*.tar.gz
