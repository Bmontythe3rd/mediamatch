name: Update apt repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-apt-repo:
    name: Publish .deb to apt repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout apt branch
        uses: actions/checkout@v4
        with:
          ref: apt
          path: apt-repo

      - name: Download .deb from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir deb-download

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ secrets.APT_GPG_KEY_ID }}:6:" | gpg --import-ownertrust

      - name: Add .deb to pool and regenerate repo metadata
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          DEB="mediamatch_${VERSION}_amd64.deb"

          # Pool directory holds all .deb files
          mkdir -p apt-repo/pool/main
          cp "deb-download/${DEB}" apt-repo/pool/main/

          # Generate Packages index
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          cd apt-repo
          dpkg-scanpackages --arch amd64 pool/main /dev/null \
            > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # Generate Release file
          cd dists/stable
          apt-ftparchive release . > Release

          # Sign
          gpg --batch --yes \
            --default-key "${{ secrets.APT_GPG_KEY_ID }}" \
            --armor --detach-sign \
            --output Release.gpg Release
          gpg --batch --yes \
            --default-key "${{ secrets.APT_GPG_KEY_ID }}" \
            --clearsign \
            --output InRelease Release

      - name: Export public key for users
        run: |
          gpg --armor --export "${{ secrets.APT_GPG_KEY_ID }}" \
            > apt-repo/mediamatch.gpg

      - name: Commit and push apt branch
        run: |
          cd apt-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add mediamatch ${{ github.event.release.tag_name }} to apt repo"
          git push
